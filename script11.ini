[script]
n0=alias ytstart {
n1=  if ($timer(YTMusic)) {
n2=    echo -a [YT Music] Watcher sudah aktif.
n3=    return
n4=  }
n5=
n6=  if (!$isfile(C:\IRC\ytmusic.ps1)) {
n7=    echo -a [YT Music] C:\IRC\ytmusic.ps1 tidak ditemukan.
n8=    return
n9=  }
n10=
n11=  ; hapus stop lama
n12=  if ($isfile(C:\IRC\ytmusic.stop)) {
n13=    .remove C:\IRC\ytmusic.stop
n14=  }
n15=
n16=  ; kosongkan lagu terakhir supaya lagu pertama ikut diumumkan
n17=  unset %yt.last
n18=
n19=  run -h powershell.exe -NoProfile -ExecutionPolicy Bypass -File "C:\IRC\ytmusic.ps1"
n20=
n21=  .timerYTMusic 0 1 ytcheck
n22=
n23=  echo -a [YT Music] Auto Now Playing ON
n24=}
n25=
n26=alias ytcheck {
n27=  if (!$isfile(C:\IRC\ytmusic.txt)) return
n28=
n29=  var %song = $read(C:\IRC\ytmusic.txt)
n30=
n31=  if (%song == $null) return
n32=
n33=  ; cegah karakter | mengacaukan command mIRC
n34=  var %song = $replace(%song,$chr(124),-)
n35=
n36=  if (%song != %yt.last) {
n37=    set %yt.last %song
n38=
n39=    ame ♫ %song ♫
n40=  }
n41=}
n42=
n43=alias ytstop {
n44=  .timerYTMusic off
n45=
n46=  write -c C:\IRC\ytmusic.stop stop
n47=
n48=  unset %yt.last
n49=
n50=  echo -a [YT Music] Auto Now Playing OFF
n51=}
